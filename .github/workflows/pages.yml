name: Build and check both websites
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-builds
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plain/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: plain
      - run: npm run build
        working-directory: plain
        env:
          ATLAS_BASE: /opportunity-atlas-china/plain/
      - run: npx tsc --noEmit
        working-directory: plain
      - run: npm test
        working-directory: plain
      - run: mkdir -p dist/plain && cp -R plain/dist/. dist/plain/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

# Live Pages content is published from the existing gh-pages branch.
